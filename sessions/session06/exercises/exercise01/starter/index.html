<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>CSS Grid i subgrid</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <main class="grid-container">
      <section class="grid-item item-1">
        <h1>Item 1</h1>
      </section>
      <section class="grid-item item-2">
        <h1>Item 2</h1>
      </section>
      <section class="grid-item item-3">
        <h1>Item 3</h1>
        <div class="grid-container-2">
          <div class="sub-item"><p>Sub-item1</p></div>
          <div class="sub-item"><p>Sub-item2</p></div>
          <div class="sub-item"><p>Sub-item3</p></div>
          <div class="sub-item"><p>Sub-item4</p></div>
          <div class="sub-item"><p>Sub-item5</p></div>
        </div>
      </section>
      <section class="grid-item item-4">
        <h1>Item 4</h1>
      </section>
      <section class="grid-item item-5">
        <h1>Item 5</h1>
      </section>
    </main>
  </body>
</html>
